name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Test Rust workspace
        run: cargo test --workspace
      - name: Test Go services
        shell: bash
        run: |
          for service in services/*; do
            (cd "$service" && go test ./...)
          done
